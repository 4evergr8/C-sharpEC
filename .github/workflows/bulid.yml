name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 还原 NuGet
        run: nuget restore HonorPCManagerisJ8.sln

      - name: 编译
        run: msbuild HonorPCManagerisJ8.sln /p:Configuration=Release

      - name: 收集文件
        run: |
          mkdir output
          copy bin\Release\*.exe output\
          copy bin\Release\*.dll output\
          copy bin\Release\*.xml output\
          copy bin\Release\config.yaml output\
          copy bin\Release\WinRing0x64.sys output\

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: HonorPCManagerisJ8
          path: output
